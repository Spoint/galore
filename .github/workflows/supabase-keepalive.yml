# Free Supabase projects pause after ~7 days without traffic; this ping keeps "galore" awake.
# ponytail: GitHub disables scheduled workflows after 60 days with no repo commits — re-enable in the Actions tab, or move to Supabase Pro.
name: Supabase keep-alive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS -o /dev/null
          -H "apikey: sb_publishable_YbzvUYpwaN6r3vM3a9JAAg_k-1XYLXT"
          "https://osmarccznvpmfwkhyynu.supabase.co/rest/v1/business_hours?select=weekday&limit=1"
